spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.user=${DB_MIGRATOR_USERNAME}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}

logging.structured.format.console=ecs

jugueria.identity.allowed-origins=https://jugueria.jhanantezana.com
jugueria.identity.jwt.issuer=jugueria-prod
# Every task must sign with the same key: without one the start-up fails, as ephemeral keys are not allowed here.
jugueria.identity.jwt.key-id=${JWT_KEY_ID}
jugueria.identity.jwt.private-key=${JWT_PRIVATE_KEY}
