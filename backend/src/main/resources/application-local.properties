spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

jugueria.identity.jwt.ephemeral-key-allowed=true

# The dev bucket is private and has no CloudFront in front of it, so image links only resolve for signed-in AWS users.
jugueria.catalog.images.public-base-url=https://jugueria-dev-media.s3.us-east-1.amazonaws.com
jugueria.catalog.images.bucket=jugueria-dev-media

# Mailpit (compose.yaml): no auth, no TLS, web UI at http://localhost:8025.
spring.mail.host=localhost
spring.mail.port=1025
