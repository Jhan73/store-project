spring.application.name=jugueria
spring.threads.virtual.enabled=true

# migrator owns a schema per module and has no rights on public, so Flyway's own bookkeeping
# needs a schema it creates itself.
spring.flyway.schemas=flyway

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Embedded columns carry the attribute name (unit_price_amount), so an entity can hold two Money values.
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

management.endpoints.web.exposure.include=health

jugueria.identity.allowed-origins=http://localhost:4200
jugueria.identity.set-password.frontend-base-url=http://localhost:4200
jugueria.identity.jwt.issuer=jugueria-local
jugueria.identity.jwt.audience=jugueria-api
jugueria.identity.jwt.key-id=local
jugueria.identity.jwt.access-token-ttl=15m
jugueria.identity.lockout.max-failed-attempts=5
jugueria.identity.lockout.lockout-duration=15m
jugueria.identity.refresh-token.idle-ttl=7d
jugueria.identity.refresh-token.absolute-ttl=30d
jugueria.identity.set-password.frontend-path=/set-password
jugueria.identity.set-password.token-ttl=48h
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
