spring.application.name=jugueria
spring.threads.virtual.enabled=true

# migrator owns a schema per module and has no rights on public, so Flyway's own bookkeeping
# needs a schema it creates itself.
spring.flyway.schemas=flyway

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Embedded columns carry the attribute name (unit_price_amount), so an entity can hold two Money values.
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

management.endpoints.web.exposure.include=health

# Trusts only the direct TCP peer's private-range address (the ALB in the VPC), not any hop beyond it.
server.forward-headers-strategy=native

# migrator (Flyway) creates modulith.event_publication; the library must never try to create it itself.
spring.modulith.events.jdbc.schema=modulith
spring.modulith.events.jdbc.schema-initialization.enabled=false
# A completed publication has no further use here (audit is the real audit trail); DELETE keeps this table bounded.
spring.modulith.events.completion-mode=delete

jugueria.web.allowed-origins=http://localhost:4200
jugueria.identity.set-password.frontend-base-url=http://localhost:4200
jugueria.identity.jwt.issuer=jugueria-local
jugueria.identity.jwt.audience=jugueria-api
jugueria.identity.jwt.key-id=local
jugueria.identity.jwt.access-token-ttl=15m
jugueria.identity.lockout.max-failed-attempts=5
jugueria.identity.lockout.lockout-duration=15m
jugueria.identity.refresh-token.idle-ttl=7d
jugueria.identity.refresh-token.absolute-ttl=30d
jugueria.identity.set-password.frontend-path=/set-password
jugueria.identity.set-password.token-ttl=48h
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

jugueria.notifications.sender-address=no-reply@jugueria.jhanantezana.com
jugueria.notifications.ses.region=us-east-1
jugueria.notifications.ses.api-call-timeout=10s
jugueria.notifications.ses.api-call-attempt-timeout=5s
jugueria.notifications.recipient-allowlist=${NOTIFICATIONS_RECIPIENT_ALLOWLIST:}

# Where CloudFront serves the media bucket; each environment overrides it with its own host.
jugueria.catalog.images.public-base-url=https://media.jugueria.jhanantezana.com
