name: Smoke test an environment
description: Check that both services in an environment answer. Needs AWS credentials already configured.

inputs:
  environment:
    description: Environment to check, test or prod.
    required: true

runs:
  using: composite
  steps:
    # Both services are checked whichever one was deployed: they share a catalog, a stock and a board.
    - name: Both services answer
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        account="$(aws sts get-caller-identity --query Account --output text)"
        failed=false
        for entry in backend:/actuator/health/readiness frontend:/healthz; do
          app="${entry%%:*}"
          path="${entry#*:}"
          arn="arn:aws:ecs:$AWS_REGION:$account:service/jugueria-$ENVIRONMENT/jugueria-$ENVIRONMENT-$app"
          endpoint="$(aws ecs describe-express-gateway-service --service-arn "$arn" \
            --query 'service.activeConfigurations[0].ingressPaths[0].endpoint' --output text)"
          if [[ "$endpoint" != http://* && "$endpoint" != https://* ]]; then
            endpoint="https://$endpoint"
          fi
          code="$(curl --silent --show-error --location --retry 5 --retry-delay 10 \
            --retry-all-errors --max-time 20 --output /dev/null \
            --write-out '%{http_code}' "${endpoint%/}$path" || echo 000)"
          echo "$app $path -> $code"
          if [[ "$code" != 200 ]]; then
            failed=true
          fi
          echo "- $app \`$path\` → $code" >> "$GITHUB_STEP_SUMMARY"
        done
        if [[ "$failed" == true ]]; then
          echo "::error::A smoke check did not return 200 in $ENVIRONMENT."
          exit 1
        fi
