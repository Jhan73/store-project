name: Smoke test an environment
description: Check that both services in an environment answer. Needs AWS credentials already configured.

inputs:
  environment:
    description: Environment to check, test or prod.
    required: true
  custom-frontend-host:
    description: Custom hostname of the frontend, without scheme. Empty skips the custom domain checks.
    required: false
    default: ""
  custom-api-host:
    description: Custom hostname of the API, without scheme. Empty skips the custom domain checks.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Both services are checked whichever one was deployed: they share a catalog, a stock and a board.
    - name: Both services answer
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        account="$(aws sts get-caller-identity --query Account --output text)"
        failed=false
        for entry in backend:/actuator/health/readiness frontend:/healthz; do
          app="${entry%%:*}"
          path="${entry#*:}"
          arn="arn:aws:ecs:$AWS_REGION:$account:service/jugueria-$ENVIRONMENT/jugueria-$ENVIRONMENT-$app"
          endpoint="$(aws ecs describe-express-gateway-service --service-arn "$arn" \
            --query 'service.activeConfigurations[0].ingressPaths[0].endpoint' --output text)"
          if [[ "$endpoint" != http://* && "$endpoint" != https://* ]]; then
            endpoint="https://$endpoint"
          fi
          code="$(curl --silent --show-error --location --retry 5 --retry-delay 10 \
            --retry-all-errors --max-time 20 --output /dev/null \
            --write-out '%{http_code}' "${endpoint%/}$path" || echo 000)"
          echo "$app $path -> $code"
          if [[ "$code" != 200 ]]; then
            failed=true
          fi
          echo "- $app \`$path\` → $code" >> "$GITHUB_STEP_SUMMARY"
        done
        if [[ "$failed" == true ]]; then
          echo "::error::A smoke check did not return 200 in $ENVIRONMENT."
          exit 1
        fi

    # Nothing heals the custom hosts, so this is the guard: a service that Express recreated, a rule
    # that lost its host or a missing DNS record must block the digest recording.
    - name: Custom domains answer
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        FRONTEND_HOST: ${{ inputs.custom-frontend-host }}
        API_HOST: ${{ inputs.custom-api-host }}
      run: |
        if [[ -z "$FRONTEND_HOST" || -z "$API_HOST" ]]; then
          echo "::notice::CUSTOM_FRONTEND_HOST and CUSTOM_API_HOST are not both set in $ENVIRONMENT, so the custom domain checks were skipped."
          exit 0
        fi
        for host in "$FRONTEND_HOST" "$API_HOST"; do
          if [[ ! "$host" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::'$host' is not a bare hostname. Set the variable without scheme or path."
            exit 1
          fi
        done

        origin="https://$FRONTEND_HOST"
        failed=false
        headers="$(mktemp)"

        status_of() {
          curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$@" || echo 000
        }

        # Retries because a new DNS record or listener change can take a minute to answer.
        expect_200() {
          local url="$1" hint="$2" code="" attempt
          for attempt in 1 2 3 4 5 6; do
            code="$(status_of "$url")"
            if [[ "$code" == 200 ]]; then
              break
            fi
            sleep 10
          done
          echo "$url -> $code"
          echo "- custom \`$url\` → $code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != 200 ]]; then
            echo "::error::Custom domain check failed in $ENVIRONMENT: $url returned $code instead of 200. $hint"
            failed=true
          fi
        }

        allow_origin_of() {
          tr -d '\r' | sed -n 's/^[Aa][Cc][Cc][Ee][Ss][Ss]-[Cc][Oo][Nn][Tt][Rr][Oo][Ll]-[Aa][Ll][Ll][Oo][Ww]-[Oo][Rr][Ii][Gg][Ii][Nn]:[[:space:]]*//p' | head -n 1
        }

        expect_200 "$origin/healthz" "Check the DNS record for $FRONTEND_HOST, the certificate on the ALB HTTPS listener, the host condition of the frontend listener rule, and NG_ALLOWED_HOSTS on the frontend service."
        expect_200 "$origin/login" "Check NG_ALLOWED_HOSTS on the frontend service and the host condition of the frontend listener rule."
        expect_200 "https://$API_HOST/actuator/health/readiness" "Check the DNS record for $API_HOST, the certificate on the ALB HTTPS listener, and the host condition of the backend listener rule."

        preflight="https://$API_HOST/api/v1/auth/login"
        code=000
        allowed=""
        for attempt in 1 2 3 4 5 6; do
          code="$(status_of --request OPTIONS --dump-header "$headers" \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,x-requested-with' "$preflight")"
          allowed="$(allow_origin_of < "$headers")"
          if [[ "$code" == 2?? && "$allowed" == "$origin" ]]; then
            break
          fi
          sleep 10
        done
        echo "preflight $preflight from $origin -> $code, allow-origin '$allowed'"
        echo "- custom preflight \`$preflight\` → $code, allow-origin \`$allowed\`" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$code" != 2?? ]]; then
          echo "::error::Custom domain check failed in $ENVIRONMENT: the CORS preflight to $preflight returned $code instead of 2xx. Check the host condition of the backend listener rule and the DNS record for $API_HOST."
          failed=true
        elif [[ "$allowed" != "$origin" ]]; then
          echo "::error::Custom domain check failed in $ENVIRONMENT: the CORS preflight allowed origin '$allowed' instead of '$origin'. The backend derives the allowed origin from the API host, so check that $API_HOST is api.<frontend host> and which service answers that host."
          failed=true
        fi

        if [[ "$failed" == true ]]; then
          exit 1
        fi
