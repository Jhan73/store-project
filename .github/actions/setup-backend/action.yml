name: Setup backend
description: Java 25 (Temurin) with the Maven dependency cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "25"
        cache: maven
        cache-dependency-path: backend/pom.xml
