name: Build image

on:
  workflow_call:
    inputs:
      app:
        description: Application to build, backend or frontend.
        required: true
        type: string
      environment:
        description: GitHub environment whose deploy role pushes to ECR.
        required: true
        type: string
      image_tag:
        description: Image tag, the full commit SHA the image is built from.
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the image in ECR.
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: Image reference pinned by digest.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: build ${{ inputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Build context for this app
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            # The backend build reads db/, so its context is the repository root.
            backend)  context=. ;;
            frontend) context=frontend ;;
            *) echo "::error::Unknown app '$APP'." ; exit 1 ;;
          esac
          {
            echo "context=$context"
            echo "dockerfile=$APP/Dockerfile"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the ECR repository
        id: ecr
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.image_tag }}
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          {
            echo "registry=$registry"
            echo "repository=jugueria/$APP"
            echo "reference=$registry/jugueria/$APP:$TAG"
          } >> "$GITHUB_OUTPUT"

      # ECR tags are immutable, so a retried run must reuse the image instead of pushing the tag again.
      - name: Image already built for this commit
        id: existing
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          TAG: ${{ inputs.image_tag }}
        run: |
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          case "$digest" in
            sha256:*) echo "Reusing $digest" ;;
            *) digest="" ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        if: steps.existing.outputs.digest == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.digest == ''

      # Built and scanned before pushing, so a vulnerable image never reaches ECR.
      - name: Build
        if: steps.existing.outputs.digest == ''
        env:
          APP: ${{ inputs.app }}
          CONTEXT: ${{ steps.app.outputs.context }}
          DOCKERFILE: ${{ steps.app.outputs.dockerfile }}
          REFERENCE: ${{ steps.ecr.outputs.reference }}
        run: |
          docker buildx build "$CONTEXT" \
            --file "$DOCKERFILE" \
            --tag "$REFERENCE" \
            --platform linux/amd64 \
            --cache-from "type=gha,scope=$APP" \
            --cache-to "type=gha,mode=max,scope=$APP" \
            --load

      - name: Vulnerability scan
        if: steps.existing.outputs.digest == ''
        env:
          REFERENCE: ${{ steps.ecr.outputs.reference }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image "$REFERENCE" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Push
        if: steps.existing.outputs.digest == ''
        env:
          APP: ${{ inputs.app }}
          CONTEXT: ${{ steps.app.outputs.context }}
          DOCKERFILE: ${{ steps.app.outputs.dockerfile }}
          REFERENCE: ${{ steps.ecr.outputs.reference }}
        run: |
          docker buildx build "$CONTEXT" \
            --file "$DOCKERFILE" \
            --tag "$REFERENCE" \
            --platform linux/amd64 \
            --cache-from "type=gha,scope=$APP" \
            --metadata-file metadata.json \
            --push

      - name: Digest
        id: digest
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          if [[ -n "$EXISTING" ]]; then
            digest="$EXISTING"
          else
            digest="$(jq -r '."containerimage.digest"' metadata.json)"
          fi
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not resolve the image digest."
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "image=$REGISTRY/$REPOSITORY@$digest"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.digest == ''
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/${{ steps.ecr.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Summary
        env:
          APP: ${{ inputs.app }}
          IMAGE: ${{ steps.digest.outputs.image }}
          REUSED: ${{ steps.existing.outputs.digest != '' }}
        run: |
          {
            echo "### $APP"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Reused an existing image: \`$REUSED\`"
          } >> "$GITHUB_STEP_SUMMARY"
