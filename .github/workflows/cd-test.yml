name: CD test

on:
  push:
    branches: [develop]
  # Redeploys an app whose code did not change, e.g. to pick up a changed environment variable.
  workflow_dispatch:
    inputs:
      redeploy:
        description: App to redeploy even if its code did not change
        type: choice
        options: [backend, frontend, both]
        required: true

permissions:
  contents: read

# Deploys are serialised and never interrupted.
concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      backend: ${{ steps.compare.outputs.backend }}
      frontend: ${{ steps.compare.outputs.frontend }}
      backend_build: ${{ steps.compare.outputs.backend_build }}
      frontend_build: ${{ steps.compare.outputs.frontend_build }}
      backend_image: ${{ steps.compare.outputs.backend_image }}
      frontend_image: ${{ steps.compare.outputs.frontend_image }}
      any: ${{ steps.compare.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compared with the commit last deployed successfully, not with the previous commit,
      # so a failed run is picked up by the next push instead of being skipped.
      - name: Apps that differ from what test runs
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REDEPLOY: ${{ inputs.redeploy }}
        run: |
          if [[ -n "$REDEPLOY" && "$REF" != "refs/heads/develop" ]]; then
            echo "::error::test only runs what develop holds; dispatch this workflow from develop."
            exit 1
          fi
          any=false
          for app in backend frontend; do
            case "$app" in
              backend)  paths=(backend db) ;;
              frontend) paths=(frontend backend/api/openapi.json) ;;
            esac

            deployed=""
            image=""
            while read -r id ref; do
              if [[ -z "$id" ]]; then
                continue
              fi
              state="$(gh api "repos/$REPOSITORY/deployments/$id/statuses" \
                --jq 'map(select(.state == "success")) | length')"
              if [[ "$state" != "0" ]]; then
                deployed="$ref"
                image="$(gh api "repos/$REPOSITORY/deployments/$id" --jq '.payload.image // ""')"
                break
              fi
            done < <(gh api "repos/$REPOSITORY/deployments?environment=test&task=deploy:$app&per_page=30" \
              --jq '.[] | "\(.id) \(.sha)"')

            if [[ -z "$deployed" ]] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
              echo "::notice::No commit recorded as deployed for $app, treating it as changed."
              changed=true
            elif git diff --quiet "$deployed" "$SHA" -- "${paths[@]}"; then
              changed=false
            else
              changed=true
            fi

            build="$changed"
            if [[ "$changed" == false && ( "$REDEPLOY" == "$app" || "$REDEPLOY" == both ) ]]; then
              # Unchanged code keeps the image already verified in test instead of a rebuild.
              if [[ -z "$image" ]]; then
                echo "::error::No verified image recorded for $app; push a change to rebuild it instead."
                exit 1
              fi
              changed=true
            fi

            if [[ "$changed" == true ]]; then
              any=true
            fi
            {
              echo "$app=$changed"
              echo "${app}_build=$build"
              echo "${app}_image=$image"
            } >> "$GITHUB_OUTPUT"
            echo "$app deploy: $changed, build: $build (deployed commit: ${deployed:-none})"
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  power-on:
    name: power on
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # test is on-demand, so it is usually stopped, and its services scaled to zero, when a
      # deploy starts.
      - uses: ./.github/actions/power
        with:
          environment: test
          state: start

  build-backend:
    name: build backend
    needs: changes
    if: needs.changes.outputs.backend_build == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-image.yml
    with:
      app: backend
      environment: test
      image_tag: ${{ github.sha }}

  build-frontend:
    name: build frontend
    needs: changes
    if: needs.changes.outputs.frontend_build == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-image.yml
    with:
      app: frontend
      environment: test
      image_tag: ${{ github.sha }}

  deploy-backend:
    name: deploy backend
    needs: [changes, power-on, build-backend]
    # A redeploy skips the build, and a skipped need would otherwise skip this job too.
    if: >-
      always() && needs.changes.outputs.backend == 'true' && needs.power-on.result == 'success'
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-ecs.yml
    with:
      app: backend
      environment: test
      image: ${{ needs.build-backend.outputs.image || needs.changes.outputs.backend_image }}
      force: ${{ needs.changes.outputs.backend_build != 'true' }}

  deploy-frontend:
    name: deploy frontend
    needs: [changes, power-on, build-frontend]
    # A redeploy skips the build, and a skipped need would otherwise skip this job too.
    if: >-
      always() && needs.changes.outputs.frontend == 'true' && needs.power-on.result == 'success'
      && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-ecs.yml
    with:
      app: frontend
      environment: test
      image: ${{ needs.build-frontend.outputs.image || needs.changes.outputs.frontend_image }}
      force: ${{ needs.changes.outputs.frontend_build != 'true' }}

  smoke:
    name: smoke
    needs: [changes, deploy-backend, deploy-frontend]
    if: always() && needs.changes.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/smoke
        with:
          environment: test
          custom-frontend-host: ${{ vars.CUSTOM_FRONTEND_HOST }}
          custom-api-host: ${{ vars.CUSTOM_API_HOST }}

  e2e:
    name: e2e
    needs: [changes, smoke]
    # The environment variables of a GitHub environment are not visible to a job-level condition,
    # so the switch is read by the first step and the rest of the job is skipped when it is off.
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the switch
        id: gate
        env:
          E2E_ENABLED: ${{ vars.E2E_ENABLED }}
        run: |
          if [[ "$E2E_ENABLED" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_ENABLED is not true; the Playwright suite did not run."
            echo "The Playwright suite did not run: E2E_ENABLED is not true." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - if: steps.gate.outputs.enabled == 'true'
        name: Install dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - if: steps.gate.outputs.enabled == 'true'
        name: Check the reporter configuration
        working-directory: e2e
        run: npm run check:config

      - if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The password is read and masked in the step that uses it, so it never reaches GITHUB_ENV,
      # GITHUB_OUTPUT, a file or a later step. No report or test-results folder is uploaded: typed
      # values are recorded in them.
      - if: steps.gate.outputs.enabled == 'true'
        name: Run the journeys against test
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_ALLOW_REMOTE: "1"
        run: |
          password="$(aws ssm get-parameter --name /jugueria/test/e2e/admin-password --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$password"
          if [[ -z "$password" || "$password" == None ]]; then
            echo "::error::The e2e admin password parameter is empty."
            exit 1
          fi
          export E2E_ADMIN_PASSWORD="$password"
          unset password
          npx playwright test

  record:
    name: record digests
    needs: [changes, build-backend, build-frontend, smoke, e2e]
    # Also runs when nothing was deployed: a release promotes whatever commit reaches main, and a
    # docs-only commit with no record of its own could not be promoted at all.
    # e2e is skipped only when nothing was deployed; once an app was deployed it must have succeeded,
    # so a cancelled run cannot record digests that never passed the suite.
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.smoke.result == 'success' || needs.changes.outputs.any != 'true')
      && (needs.changes.outputs.any != 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      # Every app is recorded, built or not, so a release PR can promote the verified image
      # of a commit that did not rebuild that app.
      - name: Record the digest running in test for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image || needs.changes.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image || needs.changes.outputs.frontend_image }}
        run: |
          for app in backend frontend; do
            case "$app" in
              backend)  image="$BACKEND_IMAGE" ;;
              frontend) image="$FRONTEND_IMAGE" ;;
            esac
            if [[ -z "$image" ]]; then
              echo "::error::No image known for $app, so the release cannot promote it."
              exit 1
            fi
            # --field cannot express an empty array or a nested payload, so the body is JSON.
            # The reference is pinned by digest, so a release promotes exactly this image without
            # having to know the registry account.
            id="$(jq -nc --arg ref "$SHA" --arg task "deploy:$app" --arg image "$image" \
              --arg description "$app running in test" \
              '{ref: $ref, environment: "test", task: $task, description: $description,
                auto_merge: false, required_contexts: [],
                payload: {image: $image, digest: ($image | split("@") | last)}}' \
              | gh api "repos/$REPOSITORY/deployments" --method POST --input - --jq '.id')"
            gh api "repos/$REPOSITORY/deployments/$id/statuses" --method POST \
              --field state=success \
              --field description="Verified by smoke tests" >/dev/null
            echo "$app -> $image"
          done
