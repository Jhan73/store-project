name: CI backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      # The spec test rewrites api/openapi.json here instead of comparing, so the next step can show the diff.
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dopenapi.write=true
      - name: OpenAPI spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- api/openapi.json)" ]; then
            git --no-pager diff -- api/openapi.json | head -200
            echo "::error file=backend/api/openapi.json::The committed spec differs from the one the controllers generate. From backend/, run: ./mvnw verify -Dit.test=OpenApiSpecIT -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dopenapi.write=true and commit backend/api/openapi.json"
            exit 1
          fi
      - name: Container image builds
        working-directory: .
        run: docker build --file backend/Dockerfile --tag backend:ci .
