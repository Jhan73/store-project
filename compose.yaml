services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: jugueria
      POSTGRES_USER: jugueria
      POSTGRES_PASSWORD: jugueria
    ports:
      - "5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql, not .../data.
      - postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
