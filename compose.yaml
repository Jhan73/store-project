services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: jugueria
      POSTGRES_USER: jugueria
      POSTGRES_PASSWORD: jugueria
    ports:
      - "5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql, not .../data.
      - postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
