services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: jugueria
      POSTGRES_USER: jugueria
      POSTGRES_PASSWORD: jugueria
    ports:
      - "5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql, not .../data.
      - postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
